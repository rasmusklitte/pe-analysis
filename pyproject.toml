[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-analysis"
version = "0.1.0"
description = "Analyser af private equity-fonde fra PE-databasen: grafer, Excel og PowerPoint i PPIM-husstil"
requires-python = ">=3.11"
dependencies = [
    "jupyter",
    "pandas",
    "numpy",
    "matplotlib",
    "openpyxl",
    "python-pptx",
    "pyodbc",
    "sqlalchemy>=2.0",
]

[tool.setuptools]
packages = ["pe_analysis", "pe_analysis.portefoelje"]
